[platformio]
default_envs = lilla_fft_r2
src_dir = .

[env:lilla_fft_r2]
build_src_filter = -<*> +<lilla/src/> +<src/>
platform = teensy@5.1.0
board = teensy41
framework = arduino
platform_packages =
    platformio/framework-arduinoteensy@1.162.0
    platformio/toolchain-gccarmnoneeabi-teensy@1.150201.0
board_build.f_cpu = 600000000L
monitor_speed = 115200
lib_extra_dirs = lilla/lib
lib_ldf_mode = deep+
build_flags = -D TEENSY_OPT_FASTEST -D LILLA_FFT_ENGINE -Wall -std=gnu++20 -Iinclude -Ililla/include -Ililla/lib -Ililla/src
lib_deps =
    https://github.com/mackron/dr_libs.git#dfe8377631000664666519fdb83da193fd8037f4
    adafruit/Adafruit GFX Library@^1.11.5
    kurte/ILI9341_t3n@0.0.0-alpha+sha.f1bfb81825
    adafruit/Adafruit MCP23017 Arduino Library@2.3.2
    adafruit/Adafruit BusIO@1.17.4
extra_scripts =
    pre:lilla/scripts/firmware_name.py
    pre:lilla/scripts/include_libraries.py
    post:lilla/scripts/mp3_flash.py
    post:lilla/scripts/copy_firmware.py
